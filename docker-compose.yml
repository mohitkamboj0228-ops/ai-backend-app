version: "3.9"

services:
  app:
    build: ./app
    container_name: fastapi_app

    ports:
      - "8000:8000"

    env_file:
      - .env.example

    depends_on:
      - postgres
      - redis

    restart: always

  postgres:
    image: postgres:16

    container_name: postgres_db

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: fastapi

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: always

  redis:
    image: redis:7

    container_name: redis_cache

    restart: always

  nginx:
    image: nginx:latest

    container_name: nginx_proxy

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    restart: always

volumes:
  postgres_data:
